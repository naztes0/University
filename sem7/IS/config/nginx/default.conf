map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;

    resolver 127.0.0.11 valid=5s ipv6=off;
    set $auth_service http://auth:8001;
    set $app_service http://app:8000;
    set $grafana_service http://grafana:3000;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    location = /nginx-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /_auth_verify {
        internal;
        proxy_pass $auth_service/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-CSRF-Check "0";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location = /_auth_verify_csrf {
        internal;
        proxy_pass $auth_service/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-CSRF-Check "1";
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location /auth/ {
        proxy_pass $auth_service$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        auth_request /_auth_verify_csrf;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @api_unauthorized;
        error_page 403 = @api_csrf_forbidden;

        proxy_pass $app_service$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-WEBAUTH-USER $auth_user;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /grafana/ {
        auth_request /_auth_verify;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @browser_login;

        proxy_pass $grafana_service$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-WEBAUTH-USER $auth_user;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        auth_request /_auth_verify;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @browser_login;

        proxy_pass $app_service$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-WEBAUTH-USER $auth_user;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @browser_login {
        return 302 /auth/login;
    }

    location @api_unauthorized {
        default_type application/json;
        return 401 '{"detail":"authentication required"}';
    }

    location @api_csrf_forbidden {
        default_type application/json;
        return 403 '{"detail":"valid CSRF token required"}';
    }
}
